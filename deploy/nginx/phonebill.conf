# phoneBill 线上 nginx 配置
#
# 部署前改这几处（搜 TODO）：
#   1. server_name 换成你的域名
#   2. ssl_certificate / ssl_certificate_key 换成证书路径
#   3. upstream 里的后端地址（Hyperf 监听的地址和端口）
#   4. root 换成前端文件所在目录
#
# 前端文件放置（release/admin.tar.gz、release/merchant.tar.gz 直接解压到 root 目录下）：
#   /www/phonebill/html/admin/     管理后台   https://域名/admin/
#   /www/phonebill/html/merchant/  商户后台   https://域名/merchant/
#
# 后端 .env 的 TRUSTED_PROXIES 要包含 nginx 连后端时的来源 IP（同机一般是 127.0.0.1，
# 后端在 Docker 里时是 Docker 网关地址，如 172.17.0.1），否则操作日志和商户 IP 白名单拿到的是 nginx 的地址。

upstream phonebill_backend {
    # TODO: Hyperf 地址
    server 127.0.0.1:9501;
    keepalive 32;
}

server {
    listen 80;
    # TODO: 域名
    server_name pay.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    # TODO: 域名
    server_name pay.example.com;

    # TODO: 证书
    ssl_certificate     /etc/nginx/ssl/pay.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/pay.example.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # TODO: 前端文件目录
    root /www/phonebill/html;

    access_log /var/log/nginx/phonebill.access.log;
    error_log  /var/log/nginx/phonebill.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 转发给后端时带上真实客户端 IP 和协议
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    # ---------- 前端 ----------

    location = / {
        return 302 /merchant/;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /merchant {
        return 301 /merchant/;
    }

    # 管理后台。只给内网访问的话打开下面两行，按需改网段
    location /admin/ {
        # allow 10.0.0.0/8;
        # deny all;
        try_files $uri $uri/ /admin/index.html;
    }

    location /merchant/ {
        try_files $uri $uri/ /merchant/index.html;
    }

    # 打包后的静态资源文件名带哈希，可以长期缓存
    location ~ ^/(admin|merchant)/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 入口页不缓存，发版后用户刷新就能拿到新版本
    location ~ ^/(admin|merchant)/index\.html$ {
        add_header Cache-Control "no-cache";
    }

    # ---------- 后端 ----------

    # 两个前端调后端：/api/xxx 去掉 /api 前缀转给后端
    location /api/ {
        proxy_pass http://phonebill_backend/;
    }

    # 商户开放接口（docs/api.md），路径原样转发
    location /open/ {
        proxy_pass http://phonebill_backend;
    }

    # 供应商结果回调：https://域名/notify/supplier/{供应商编码}
    location /notify/ {
        proxy_pass http://phonebill_backend;
    }

    # 健康检查（后端 GET /）
    location = /health {
        proxy_pass http://phonebill_backend/;
        access_log off;
    }
}
